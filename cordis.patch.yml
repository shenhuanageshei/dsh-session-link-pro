# dsh-team-link bundle patch — applied automatically when this
# package is installed with `dsh plugin --profile <name> add dsh-team-link`
# (the package declares `dsh.bundle.patch` in its package.json).
#
# NOTE: only this package's own row is composed. The upstream
# @deepseek-ai/dsh-session-reference service already ships with the DSH desktop
# shell (loader id 'session-reference'); inserting it again here would create a
# duplicate loader entry id and crash profile startup.
- insert:
    - id: team-link
      name: 'dsh-team-link'
